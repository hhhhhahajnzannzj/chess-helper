name: Build Chess Helper iOS (IPA)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Find the iOS project and apply the Stockfish 19 upgrade
        shell: bash
        run: |
          set -e
          mkdir -p _project
          for z in ./*.zip; do
            if [ -f "$z" ]; then echo "Unzipping $z"; unzip -q -o "$z" -d _project; fi
          done
          if [ -d "./ios/overlay" ]; then
            mkdir -p _project/ios
            cp -R ./ios/overlay/. _project/ios/
          fi
          Y=$(find _project -name project.yml -path "*/ios/*" | head -1)
          if [ -z "$Y" ]; then echo "::error::ios/project.yml not found"; exit 1; fi
          echo "IOS_DIR=$(cd "$(dirname "$Y")" && pwd)" >> "$GITHUB_ENV"
          echo "Found: $Y"

      - name: Show the tools
        shell: bash
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen and make the Xcode project
        shell: bash
        run: |
          set -e
          brew install xcodegen
          cd "$IOS_DIR"
          xcodegen generate
          ls

      - name: Build the app (unsigned)
        shell: bash
        run: |
          set -o pipefail
          cd "$IOS_DIR"
          SWIFTSTOCKFISH_FORCE_SOURCE_ENGINE=1 xcodebuild -project ChessHelper.xcodeproj -scheme ChessHelper -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unable|BUILD |Compiling|Linking" | tail -n 60 || true
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            echo "::error::xcodebuild failed. Last lines:"
            tail -n 80 build.log
            exit 1
          fi

      - name: Allow background audio (needed for the floating Picture in Picture board)
        shell: bash
        run: |
          set -e
          cd "$IOS_DIR"
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          PLIST="$APP/Info.plist"
          if /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" >/dev/null 2>&1; then
            echo "UIBackgroundModes already there"
          else
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" -c "Add :UIBackgroundModes:0 string audio" "$PLIST"
          fi
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"

      - name: Pack the .ipa
        shell: bash
        run: |
          set -e
          cd "$IOS_DIR"
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          ls -la "$APP" | head -30
          rm -rf Payload ChessHelper-iOS.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry ChessHelper-iOS.ipa Payload
          ls -la ChessHelper-iOS.ipa
          cp ChessHelper-iOS.ipa "$GITHUB_WORKSPACE/ChessHelper-iOS.ipa"

      - name: Keep the build log if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ${{ env.IOS_DIR }}/build.log

      - name: Publish the .ipa in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ github.run_number }}
          name: Chess Helper iOS (.ipa) #${{ github.run_number }}
          files: ChessHelper-iOS.ipa
          body: |
            Chess Helper for iPhone/iPad (unsigned .ipa, real Stockfish 19 engine). The required NNUE network is downloaded and SHA-256 verified on first launch; internet is needed for initial setup.
            It is NOT signed: install it with Sideloadly, AltStore or TrollStore (see ios/README.md in the project).
            iOS does not allow a free floating window over other apps. This app has a floating Picture in Picture board instead: it shows the board and the blue move on top of other apps (view only; tap the moves in the app).
