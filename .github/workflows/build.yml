name: Build Chess Helper APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Find the project (unzips it if you uploaded the .zip)
        id: proj
        shell: bash
        run: |
          set +e
          echo "Files in the repository:"
          ls -la
          for z in ./*.zip; do
            if [ -f "$z" ]; then echo "Unzipping $z"; unzip -q -o "$z" -d _project; fi
          done
          G=$(find . -name gradlew -not -path "./.git/*" | head -1)
          if [ -z "$G" ]; then
            echo "::error title=Project not found::No gradlew file found. Upload ChessHelperAndroid.zip (the original, not converted) to the repository, then run again."
            exit 1
          fi
          echo "Found gradlew at: $G"
          echo "dir=$(dirname "$G")" >> "$GITHUB_OUTPUT"

      - name: Build Stockfish (the real engine) for Android
        shell: bash
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}}"
          echo "Using NDK: $NDK"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          git clone --depth 1 --branch sf_19 https://github.com/official-stockfish/Stockfish.git
          cd Stockfish/src
          ok=0
          for i in 1 2 3 4; do
            rm -f *.nnue
            make net || true
            if ls *.nnue > /dev/null 2>&1 && [ -z "$(find . -maxdepth 1 -name '*.nnue' -size -1000k)" ]; then ok=1; break; fi
            echo "Network files not complete, retrying ($i)"; sleep 15
          done
          [ "$ok" = 1 ] || { echo "::error::could not download the Stockfish network files"; exit 1; }
          ls -la *.nnue
          # two builds: a fast one for phones with the ARM dot-product instructions, and a safe one for the rest
          make -j4 build ARCH=armv8-dotprod COMP=ndk
          file stockfish
          cp stockfish stockfish_dp
          make clean
          make -j4 build ARCH=armv8 COMP=ndk
          file stockfish
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d stockfish | grep -E "NEEDED|Shared" || true
          DEST="$GITHUB_WORKSPACE/${{ steps.proj.outputs.dir }}/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" stockfish stockfish_dp
          cp stockfish "$DEST/libstockfish.so"
          cp stockfish_dp "$DEST/libstockfish_dp.so"
          ls -la "$DEST"

      - name: Accept Android SDK licences
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build the APK
        working-directory: ${{ steps.proj.outputs.dir }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ChessHelper.apk"
          ls -la "$GITHUB_WORKSPACE/ChessHelper.apk"
          unzip -l "$GITHUB_WORKSPACE/ChessHelper.apk" | grep -E "libstockfish|lib/" || true
          unzip -l "$GITHUB_WORKSPACE/ChessHelper.apk" | grep -q "lib/arm64-v8a/libstockfish_dp.so" || { echo "::error::fast Stockfish is missing from the APK"; exit 1; }
          unzip -l "$GITHUB_WORKSPACE/ChessHelper.apk" | grep -q "lib/arm64-v8a/libstockfish.so" || { echo "::error::Stockfish is missing from the APK"; exit 1; }

      - name: Publish APK to Releases (easy download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Chess Helper APK ${{ github.run_number }}
          files: ChessHelper.apk
          
