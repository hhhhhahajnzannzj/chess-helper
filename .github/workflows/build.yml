name: Build Chess Helper APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Find the project (unzips it if you uploaded the .zip)
        id: proj
        shell: bash
        run: |
          set +e
          echo "Files in the repository:"
          ls -la
          for z in ./*.zip; do
            if [ -f "$z" ]; then echo "Unzipping $z"; unzip -q -o "$z" -d _project; fi
          done
          G=$(find . -name gradlew -not -path "./.git/*" | head -1)
          if [ -z "$G" ]; then
            echo "::error title=Project not found::No gradlew file found. Upload ChessHelperAndroid.zip (the original, not converted) to the repository, then run again."
            exit 1
          fi
          echo "Found gradlew at: $G"
          echo "dir=$(dirname "$G")" >> "$GITHUB_OUTPUT"

      - name: Build Stockfish (the real engine) for Android - 64-bit and 32-bit phones
        shell: bash
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}}"
          echo "Using NDK: $NDK"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$BIN:$PATH"
          PROJ="$GITHUB_WORKSPACE/${{ steps.proj.outputs.dir }}"
          git clone --depth 1 --branch sf_19 https://github.com/official-stockfish/Stockfish.git
          cd Stockfish/src
          ok=0
          for i in 1 2 3 4; do
            rm -f *.nnue
            make net || true
            if ls *.nnue > /dev/null 2>&1 && [ -z "$(find . -maxdepth 1 -name '*.nnue' -size -1000k)" ]; then ok=1; break; fi
            echo "Network files not complete, retrying ($i)"; sleep 15
          done
          [ "$ok" = 1 ] || { echo "::error::could not download the Stockfish network files"; exit 1; }
          ls -la *.nnue
          # build_sf <ARCH> <compiler prefix> <file name in the app> <app ABI folder>
          # Built for Android 8 (API 26) like the app; if that fails the engine's own default (API 29) is used.
          build_sf() {
            make clean
            if ! make -j4 build ARCH="$1" COMP=ndk CXX="$2"26-clang++; then
              echo "::warning::API 26 build of $1 failed, using the default API"
              make clean
              make -j4 build ARCH="$1" COMP=ndk
            fi
            file stockfish
            "$BIN/llvm-readelf" -d stockfish | grep -E "NEEDED|Shared" || true
            "$BIN/llvm-strip" stockfish
            mkdir -p "$PROJ/app/src/main/jniLibs/$4"
            cp stockfish "$PROJ/app/src/main/jniLibs/$4/$3"
          }
          # 64-bit phones: a fast build for phones with the ARM dot-product instructions, and a safe one for the rest
          build_sf armv8-dotprod aarch64-linux-android libstockfish_dp.so arm64-v8a
          build_sf armv8 aarch64-linux-android libstockfish.so arm64-v8a
          # 32-bit phones (and 64-bit phones running 32-bit Android)
          build_sf armv7-neon armv7a-linux-androideabi libstockfish.so armeabi-v7a
          ls -la "$PROJ"/app/src/main/jniLibs/*

      - name: Second engine for the Engine Agent (Reckless, optional - the APK is built without it if this fails)
        continue-on-error: true
        shell: bash
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          PROJ="$GITHUB_WORKSPACE/${{ steps.proj.outputs.dir }}"
          git clone --depth 1 https://github.com/codedeliveryservice/Reckless.git
          cd Reckless
          git log -1 --format='Reckless commit %h %cd'
          # 1. a normal build for this computer, only to check that it speaks UCI the way the app expects
          RUSTFLAGS="-C target-cpu=native" CARGO_PROFILE_RELEASE_LTO=false CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 \
            cargo build --release --no-default-features --bin reckless
          ls -la networks/ target/release/reckless
          (printf 'uci\nsetoption name Threads value 1\nsetoption name Hash value 16\nsetoption name MultiPV value 3\nisready\nposition startpos\ngo movetime 1500\n'; sleep 3; \
           printf 'position fen r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3\ngo movetime 400 searchmoves f1b5\n'; sleep 1.5; printf 'quit\n') \
            | ./target/release/reckless > ../reckless_uci.txt || true
          grep -E "^id name|^uciok|^readyok" ../reckless_uci.txt || true
          echo "info lines with multipv: $(grep -c 'multipv' ../reckless_uci.txt)"
          grep -E "^bestmove" ../reckless_uci.txt
          grep -q "multipv 3" ../reckless_uci.txt || { echo "::error::Reckless did not report 3 lines"; exit 1; }
          # 2. the build for 64-bit phones with the dot-product instructions
          rustup target add aarch64-linux-android
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android26-clang"
          RUSTFLAGS="-C target-feature=+dotprod" cargo build --release --no-default-features --bin reckless --target aarch64-linux-android
          OUT=target/aarch64-linux-android/release/reckless
          "$BIN/llvm-strip" "$OUT"
          file "$OUT"
          ls -la "$OUT"
          SIZE=$(stat -c%s "$OUT")
          if [ "$SIZE" -gt 140000000 ]; then echo "::warning::Reckless is $SIZE bytes - too big for the APK, leaving it out"; exit 0; fi
          mkdir -p "$PROJ/app/src/main/jniLibs/arm64-v8a"
          cp "$OUT" "$PROJ/app/src/main/jniLibs/arm64-v8a/libengdp_reckless.so"
          ls -la "$PROJ/app/src/main/jniLibs/arm64-v8a"

      - name: Extra engine ShashChess (optional - only goes into the allengines APK)
        continue-on-error: true
        shell: bash
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$BIN:$PATH"
          OUT="$GITHUB_WORKSPACE/extra-engines-out"; mkdir -p "$OUT"
          git clone --depth 1 https://github.com/amchess/ShashChess.git
          cd ShashChess/src
          git log -1 --format='ShashChess commit %h %cd %s'
          grep -n "EvalFileDefaultName" evaluate.h | head -3
          cp "$GITHUB_WORKSPACE"/Stockfish/src/*.nnue . 2>/dev/null || true
          make net || true
          ls -la *.nnue
          make clean || true
          make -j4 build ARCH=armv8-dotprod COMP=ndk CXX=aarch64-linux-android26-clang++ EXE=shashchess_bin
          file shashchess_bin
          "$BIN/llvm-strip" shashchess_bin
          ls -la shashchess_bin
          cp shashchess_bin "$OUT/libengdp_shashchess.so"

      - name: Extra engine Triumviratus (optional - only goes into the allengines APK)
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}}"
          OUT="$GITHUB_WORKSPACE/extra-engines-out"; mkdir -p "$OUT"
          git clone --depth 1 https://github.com/Tors3/Triumviratus.git
          cd Triumviratus/source
          git log -1 --format='Triumviratus commit %h %cd %s'
          URL=$(curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/Tors3/Triumviratus-Networks/releases/tags/consilium-plebis \
                | python3 -c "import sys,json; d=json.load(sys.stdin); print([a['browser_download_url'] for a in d['assets'] if a['name'].endswith('.nnue')][0])")
          echo "network: $URL"
          curl -fL --retry 3 -o nn-consilium-plebis.nnue "$URL"
          ls -la nn-consilium-plebis.nnue
          [ "$(stat -c%s nn-consilium-plebis.nnue)" -gt 1000000 ]
          make clean || true
          make android-dotprod NDK="$NDK" -j4
          file triumviratus_android
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" triumviratus_android
          ls -la triumviratus_android
          cp triumviratus_android "$OUT/libengdp_triumviratus.so"

      - name: Extra engine PlentyChess (optional - only goes into the allengines APK)
        continue-on-error: true
        shell: bash
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$BIN:$PATH"
          OUT="$GITHUB_WORKSPACE/extra-engines-out"; mkdir -p "$OUT"
          git clone --depth 1 https://github.com/Yoshie2000/PlentyChess.git
          cd PlentyChess
          git log -1 --format='PlentyChess commit %h %cd %s'
          cat network.txt
          make -j4 arch=android EXE=plentychess_bin
          file plentychess_bin
          "$BIN/llvm-strip" plentychess_bin
          ls -la plentychess_bin
          cp plentychess_bin "$OUT/libengdp_plentychess.so"

      - name: Add the engines you put in the engines folder (optional)
        shell: bash
        run: |
          PROJ="$GITHUB_WORKSPACE/${{ steps.proj.outputs.dir }}"
          for pair in arm64:arm64-v8a arm32:armeabi-v7a; do
            src="engines/${pair%%:*}"; dst="${pair##*:}"
            [ -d "$src" ] || continue
            for f in "$src"/*; do
              [ -f "$f" ] || continue
              case "$f" in *.md|*.txt) continue;; esac
              n=$(basename "$f" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9]/_/g')
              mkdir -p "$PROJ/app/src/main/jniLibs/$dst"
              cp "$f" "$PROJ/app/src/main/jniLibs/$dst/libeng_$n.so"
              echo "Added engine $f for $dst as libeng_$n.so"
            done
          done

      - name: Accept Android SDK licences
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build the APKs (one for 64-bit phones, one for 32-bit phones)
        working-directory: ${{ steps.proj.outputs.dir }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -PabiTarget=arm64-v8a
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ChessHelper-arm64.apk"
          ./gradlew assembleDebug --no-daemon --stacktrace -PabiTarget=armeabi-v7a
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ChessHelper-arm32.apk"
          ls -la "$GITHUB_WORKSPACE"/ChessHelper-*.apk
          echo "---- 64-bit APK"; unzip -l "$GITHUB_WORKSPACE/ChessHelper-arm64.apk" | grep -E "lib/" || true
          echo "---- 32-bit APK"; unzip -l "$GITHUB_WORKSPACE/ChessHelper-arm32.apk" | grep -E "lib/" || true
          A64="$GITHUB_WORKSPACE/ChessHelper-arm64.apk"; A32="$GITHUB_WORKSPACE/ChessHelper-arm32.apk"
          unzip -l "$A64" | grep -q "lib/arm64-v8a/libstockfish_dp.so" || { echo "::error::fast Stockfish is missing from the 64-bit APK"; exit 1; }
          unzip -l "$A64" | grep -q "lib/arm64-v8a/libstockfish.so" || { echo "::error::Stockfish is missing from the 64-bit APK"; exit 1; }
          unzip -l "$A64" | grep -q "lib/armeabi-v7a/" && { echo "::error::32-bit files are inside the 64-bit APK"; exit 1; }
          unzip -l "$A32" | grep -q "lib/armeabi-v7a/libstockfish.so" || { echo "::error::Stockfish is missing from the 32-bit APK"; exit 1; }
          unzip -l "$A32" | grep -q "lib/arm64-v8a/" && { echo "::error::64-bit files are inside the 32-bit APK"; exit 1; }
          if unzip -l "$A64" | grep -q "libengdp_reckless.so"; then echo "Engine Agent (Reckless) is in the 64-bit APK"; else echo "Engine Agent: no second engine in this build"; fi
          # the 64-bit APK with every second engine that could be built
          echo "---- extra engines built:"; ls -la "$GITHUB_WORKSPACE"/extra-engines-out 2>/dev/null || echo "none"
          if ls "$GITHUB_WORKSPACE"/extra-engines-out/* > /dev/null 2>&1; then
            mkdir -p app/src/main/jniLibs/arm64-v8a
            cp "$GITHUB_WORKSPACE"/extra-engines-out/* app/src/main/jniLibs/arm64-v8a/
            ./gradlew assembleDebug --no-daemon --stacktrace -PabiTarget=arm64-v8a
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ChessHelper-arm64-allengines.apk"
            ls -la "$GITHUB_WORKSPACE"/ChessHelper-arm64-allengines.apk
            echo "---- allengines APK"; unzip -l "$GITHUB_WORKSPACE/ChessHelper-arm64-allengines.apk" | grep -E "lib/" || true
          fi
          true

      - name: Publish the APKs to Releases (easy download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Chess Helper APK ${{ github.run_number }}
          body: |
            Two files, pick the one for your phone:
            - **ChessHelper-arm64.apk** - phones with a 64-bit processor (almost every phone made since 2017). Choose this one if unsure.
            - **ChessHelper-arm32.apk** - older or low-end phones, or phones running 32-bit Android.
            - **ChessHelper-arm64-allengines.apk** - optional, 64-bit phones only, very large: also has Triumviratus, PlentyChess and ShashChess for the Engine Agent (only the ones that could be built; needs a lot of free space and memory).

            If Android says the app cannot be installed because of the processor type, take the other file.
            If it says the app conflicts with an existing one, uninstall the old Chess Helper first.
          files: |
            ChessHelper-arm64.apk
            ChessHelper-arm32.apk
            ChessHelper-arm64-allengines.apk
