name: Build Chess Helper APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Find the project (unzips it if you uploaded the .zip)
        id: proj
        shell: bash
        run: |
          set +e
          echo "Files in the repository:"
          ls -la
          for z in ./*.zip; do
            if [ -f "$z" ]; then echo "Unzipping $z"; unzip -q -o "$z" -d _project; fi
          done
          G=$(find . -name gradlew -not -path "./.git/*" | head -1)
          if [ -z "$G" ]; then
            echo "::error title=Project not found::No gradlew file found. Upload ChessHelperAndroid.zip (the original, not converted) to the repository, then run again."
            exit 1
          fi
          echo "Found gradlew at: $G"
          echo "dir=$(dirname "$G")" >> "$GITHUB_OUTPUT"

      - name: Accept Android SDK licences
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build the APK
        working-directory: ${{ steps.proj.outputs.dir }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ChessHelper.apk"

      - name: Publish APK to Releases (easy download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Chess Helper APK ${{ github.run_number }}
          files: ChessHelper.apk
          
