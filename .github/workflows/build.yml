name: Build Chess Helper APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Find the project (unzips it if you uploaded the .zip)
        id: proj
        run: |
          for z in *.zip; do [ -e "$z" ] && unzip -q -o "$z" -d _project; done
          G=$(find . -name gradlew -not -path "./.git/*" | head -1)
          echo "Found gradlew at: $G"
          echo "dir=$(dirname "$G")" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ChessHelper.apk"

      - name: Publish APK to Releases (easy download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Chess Helper APK ${{ github.run_number }}
          files: ChessHelper.apk
          
