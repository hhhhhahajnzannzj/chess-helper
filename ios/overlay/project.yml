name: ChessHelper
options:
  bundleIdPrefix: com.chesshelper
  deploymentTarget:
    iOS: "16.0"
packages:
  SwiftStockfish:
    url: https://github.com/fianchettochess/SwiftStockfish.git
    from: 19.0.7
targets:
  ChessHelper:
    type: application
    platform: iOS
    sources:
      - path: ChessHelper
    dependencies:
      - package: SwiftStockfish
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chesshelper.app
        PRODUCT_NAME: ChessHelper
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Chess Helper"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
